name: update

# Follows gs releases: rewrites the formula for the latest release, checks
# that it installs, and commits it.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Taps this repository; the formula is then updated, tested and pushed
      # from the tap itself, so the install check covers the new formula.
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Update, check and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$(brew --repository gitslice-io/tap)"
          bin/update-formula
          if git diff --quiet; then
            echo "formula is current"
            exit 0
          fi
          version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/gitslice.rb)"
          brew install gitslice-io/tap/gitslice
          brew test gitslice-io/tap/gitslice
          GS_NO_UPDATE_CHECK=1 gs version | grep -q "gs version v${version}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "gitslice ${version}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
